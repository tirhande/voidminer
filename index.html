<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VOIDMINER</title>
    <style>
      :root {
        --hud-cyan: #7fe3ff;
        --hud-dim: rgba(127, 227, 255, 0.55);
        --hud-locked: #ff6b6b;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #04060d;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        color: var(--hud-cyan);
        cursor: crosshair;
      }

      #viewport {
        display: block;
        width: 100%;
        height: 100%;
      }

      .hud {
        position: fixed;
        pointer-events: none;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-shadow: 0 0 8px rgba(127, 227, 255, 0.5);
      }

      #hud-readout {
        left: 24px;
        bottom: 24px;
        line-height: 1.7;
      }

      #hud-readout .label {
        color: var(--hud-dim);
      }

      #hud-controls {
        right: 24px;
        bottom: 24px;
        text-align: right;
        line-height: 1.7;
        color: var(--hud-dim);
      }

      #hud-reticle {
        left: 50%;
        top: 50%;
        width: 26px;
        height: 26px;
        margin: -13px 0 0 -13px;
        border: 1px solid rgba(127, 227, 255, 0.35);
        border-radius: 50%;
      }

      #hud-reticle::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 2px;
        height: 2px;
        margin: -1px 0 0 -1px;
        background: var(--hud-cyan);
      }

      /* 조준 대상 표시는 화면 구석이 아니라 조준점 바로 아래에 둔다.
         시선이 이미 거기 있으므로 눈을 옮기지 않아도 읽힌다. */
      #hud-aim {
        left: 50%;
        top: 50%;
        transform: translateX(-50%);
        margin-top: 24px;
        text-align: center;
        line-height: 1.6;
        white-space: nowrap;
      }

      #hud-aim .mineral {
        font-size: 14px;
        letter-spacing: 0.14em;
      }

      #hud-aim .remaining {
        font-size: 11px;
        color: var(--hud-dim);
      }

      #hud-aim .requirement {
        font-size: 11px;
        color: var(--hud-locked);
        letter-spacing: 0.06em;
      }

      #hud-aim.locked .mineral {
        color: var(--hud-locked);
      }

      #hud-cargo {
        right: 24px;
        top: 24px;
        text-align: right;
        line-height: 1.8;
        min-width: 150px;
      }

      #hud-cargo .title {
        color: var(--hud-dim);
        letter-spacing: 0.16em;
      }

      #hud-cargo .row {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        font-variant-numeric: tabular-nums;
      }

      #hud-cargo .row .name {
        color: var(--hud-dim);
      }

      #hud-cargo.full .title {
        color: var(--hud-locked);
      }

      #hud-equipment {
        left: 24px;
        top: 24px;
        line-height: 1.8;
      }

      #hud-equipment .label {
        color: var(--hud-dim);
      }

      /* 목표는 화면 위쪽 가운데에 둔다. 시선이 조준점 근처에 머무르므로
         멀지 않으면서, 조준 대상 표시와는 위아래로 갈린다. */
      #hud-objective {
        left: 50%;
        top: 26px;
        transform: translateX(-50%);
        text-align: center;
        line-height: 1.7;
        max-width: min(560px, 80vw);
      }

      #hud-objective .step {
        color: var(--hud-dim);
        font-size: 11px;
        letter-spacing: 0.18em;
      }

      #hud-objective .text {
        font-size: 15px;
        letter-spacing: 0.08em;
      }

      #hud-objective .hint {
        font-size: 11px;
        color: var(--hud-dim);
      }

      #hud-objective.done .text {
        color: #9df5c4;
      }

      #hud-dock-prompt {
        left: 50%;
        bottom: 96px;
        transform: translateX(-50%);
        text-align: center;
        letter-spacing: 0.12em;
      }

      #hud-station {
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(560px, 82vw);
        padding: 22px 26px;
        border: 1px solid rgba(127, 227, 255, 0.28);
        background: rgba(4, 8, 16, 0.9);
        display: grid;
        gap: 16px;
      }

      #hud-station h2 {
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.3em;
        color: var(--hud-dim);
      }

      #hud-station .row {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      #hud-station .row .label {
        color: var(--hud-dim);
      }

      #hud-station .action {
        display: grid;
        grid-template-columns: 22px 1fr auto;
        gap: 12px;
        align-items: baseline;
        font-size: 12px;
      }

      #hud-station .action .key {
        color: var(--hud-cyan);
      }

      #hud-station .action .detail {
        color: var(--hud-dim);
        font-size: 11px;
        text-align: right;
      }

      #hud-station .action.unavailable {
        opacity: 0.38;
      }

      #hud-station .divider {
        height: 1px;
        background: rgba(127, 227, 255, 0.18);
      }

      #hud-station .message {
        font-size: 12px;
        min-height: 1.4em;
        color: #9df5c4;
      }

      /* 오버레이의 .hidden 은 페이드용이라 display 를 건드리면 안 된다.
         패널 계열은 별도 클래스로 완전히 감춘다.

         id 로 display 를 지정한 요소는 클래스 규칙만으로 덮이지 않는다.
         우선순위가 id 100 대 클래스 10 이라 감추는 쪽이 진다. 그래서 감추는
         규칙도 id 를 함께 적어 우선순위를 맞춘다. */
      #hud-station.is-hidden,
      #hud-dock-prompt.is-hidden,
      .is-hidden {
        display: none;
      }

      #overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 18px;
        text-align: center;
        background: radial-gradient(
          ellipse at center,
          rgba(4, 6, 13, 0.72),
          rgba(4, 6, 13, 0.96)
        );
        backdrop-filter: blur(2px);
        transition: opacity 0.35s ease;
      }

      #overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #overlay h1 {
        font-size: 44px;
        font-weight: 500;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        text-shadow: 0 0 24px rgba(127, 227, 255, 0.45);
      }

      #overlay p {
        font-size: 13px;
        color: var(--hud-dim);
        letter-spacing: 0.1em;
      }
    </style>
  </head>
  <body>
    <canvas id="viewport"></canvas>

    <div id="hud-reticle" class="hud"></div>

    <div id="hud-aim" class="hud">
      <div class="mineral" id="aim-mineral"></div>
      <div class="remaining" id="aim-remaining"></div>
      <div class="requirement" id="aim-requirement"></div>
    </div>

    <div id="hud-cargo" class="hud">
      <div class="title">CARGO <span id="cargo-total">0</span>/<span id="cargo-capacity">0</span></div>
      <div id="cargo-rows"></div>
    </div>

    <div id="hud-equipment" class="hud">
      <div><span class="label">LASER</span> <span id="equipment-laser">T1</span></div>
      <div><span class="label">TRACTOR</span> <span id="equipment-tractor">T1</span></div>
      <div><span class="label">STATION</span> <span id="equipment-station">--</span></div>
    </div>

    <div id="hud-objective" class="hud">
      <div class="step" id="objective-step"></div>
      <div class="text" id="objective-text"></div>
      <div class="hint" id="objective-hint"></div>
    </div>

    <div id="hud-dock-prompt" class="hud is-hidden">E — 도킹</div>

    <div id="hud-station" class="hud is-hidden">
      <h2>STATION</h2>
      <div id="station-stock"></div>
      <div class="divider"></div>
      <div id="station-actions"></div>
      <div class="divider"></div>
      <div class="message" id="station-message"></div>
      <div class="row"><span class="label">E</span><span>도킹 해제</span></div>
    </div>

    <div id="hud-readout" class="hud">
      <div><span class="label">SPD</span> <span id="readout-speed">0</span> m/s</div>
      <div><span class="label">THR</span> <span id="readout-throttle">IDLE</span></div>
      <div><span class="label">AST</span> <span id="readout-assist">OFF</span></div>
      <div><span class="label">TRC</span> <span id="readout-tractor">OFF</span></div>
    </div>

    <div id="hud-controls" class="hud">
      <div>W/S THRUST &nbsp; A/D STRAFE &nbsp; R/F LIFT &nbsp; Q/E ROLL</div>
      <div>LMB MINING LASER &nbsp; RMB TRACTOR BEAM</div>
      <div>SHIFT BOOST &nbsp; SPACE INERTIAL ASSIST &nbsp; ESC RELEASE</div>
    </div>

    <div id="overlay">
      <h1>VOIDMINER</h1>
      <p>캐서 만들고, 더 좋은 것을 캔다</p>
      <p>화면을 클릭하면 조종이 시작된다</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
